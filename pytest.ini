[pytest]
pythonpath = src
testpaths = tests
markers =
    unit: no external dependencies such as DB, network, or BridgeLab
    db_integration: requires live AzerothCore/WM DB; set WM_TEST_DB_HOST to enable
    bridge_contract: requires BridgeLab with native bridge; set WM_TEST_BRIDGELAB=1 to enable
    content_plan: dry-run content planning tests that may read live DB schema; set WM_TEST_DB_HOST to enable
norecursedirs = .git .tmp .venv .wm-bootstrap .wm-pytest-tmp .wm-test-tmp artifacts data optional pytest-cache-files-* tmp*
