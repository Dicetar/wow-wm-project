name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit suite (DB-free)
        run: python -m pytest -q
      - name: Feature status valid
        run: python -m wm.status --validate
      - name: Native contract coverage
        run: python -m wm.sources.native_bridge.contracts_cli
      - name: Wild feature catalog valid
        run: python -m wm.living.catalog --validate
      - name: Wild features dry-run clean
        run: python -m wm.living.catalog --dry-run-all
